name: Go Lint & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
